<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Fixes lowercase 'mcs' or missing trailing slash from Facebook Mobile links
      var currentUrl = window.location.href;
      var correctUrl = currentUrl.replace(/\/mcs(\?|\/|$)/i, "/MCS/");
      
      if (currentUrl !== correctUrl) {
        window.location.replace(correctUrl);
      } else {
        window.location.replace("https://millcreeksystemsmi.github.io/MCS/");
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="https://millcreeksystemsmi.github.io/MCS/">Mill Creek Systems</a>...</p>
  </body>
</html>
